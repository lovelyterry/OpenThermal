; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:espirc]
; platform = https://github.com/Jason2866/platform-espressif32/releases/download/2023.02.00/platform-espressif32.zip
; board = ESP32-C3-F4P0

platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.01.00/platform-espressif32.zip
platform_packages = framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/2.0.14/esp32-2.0.14.zip
board = ESP32-S3-F4P2

framework = arduino
monitor_speed = 921600
upload_speed = 921600

debug_tool = esp-builtin

build_type = release

build_unflags = 
	-std=gnu++11

build_flags = 
	-D I2C_BUFFER_LENGTH=1024
	-D ARDUINO_USB_MODE=1
	-D CORE_DEBUG_LEVEL=0
	-D PLATFORM_ARDUINO=1
	-I src
	-std=gnu++17
	-fexceptions
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections

monitor_filters = esp32_exception_decoder, colorize
extra_scripts = ./littlefs.py
board_build.filesystem = littlefs
lib_deps = 
	naguissa/uTimerLib@^1.7.2
	lovyan03/LovyanGFX@1.1.16
